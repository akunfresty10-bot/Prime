<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title class="site-brand-name">PRIME CT - Produk</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #090b10;
      --bg-card-solid: #141824;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --text-main: #f0f6fc;
      --text-sub: #94a3b8;
      --wa-green: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); }
    
    @keyframes rgbGlowText {
      0% { color: #ff3366; filter: drop-shadow(0 0 10px rgba(255, 51, 102, 0.5)); }
      25% { color: #38bdf8; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); }
      50% { color: #a855f7; filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5)); }
      75% { color: #34d399; filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.5)); }
      100% { color: #ff3366; filter: drop-shadow(0 0 10px rgba(255, 51, 102, 0.5)); }
    }

    header { background: rgba(13, 16, 24, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 90; border-bottom: 1px solid var(--border-color); }
    .nav-container { max-width: 800px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); }
    .brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border-color); }
    .brand span { font-size: 1.15rem; font-weight: 800; background: linear-gradient(135deg, #c084fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-btn-wa { background-color: var(--wa-green); color: #fff; padding: 8px 14px; border-radius: 20px; text-decoration: none; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }

    .container { max-width: 800px; margin: 0 auto; padding: 20px 16px; }

    .back-portal-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-sub); text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 10px; }
    .back-portal-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }

    .search-box { position: relative; margin-bottom: 16px; }
    .search-box input { width: 100%; padding: 12px 16px 12px 42px; background: var(--bg-card-solid); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

    .category-tabs { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { background: var(--bg-card-solid); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #7c3aed; color: #fff; border-color: #a78bfa; }

    .section-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .section-title i.rgb-title { animation: rgbGlowText 6s infinite linear; -webkit-text-fill-color: initial; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 30px; }
    .store-card { background: var(--bg-card-solid); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: inherit; position: relative; cursor: pointer; transition: transform 0.2s; }
    .store-card:hover { transform: translateY(-3px); border-color: var(--accent-purple); }
    .card-badge { position: absolute; top: 8px; right: 8px; background: rgba(124, 58, 237, 0.9); color: #fff; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .card-img { width: 100%; height: 110px; border-radius: 8px; margin-bottom: 8px; object-fit: cover; }
    .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
    .card-desc { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-price { font-size: 0.9rem; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
    .card-btn { background: #2563eb; color: #fff; text-align: center; padding: 6px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; }
    .state-msg { grid-column: 1 / -1; text-align: center; padding: 25px; color: var(--text-sub); background: var(--bg-card-solid); border-radius: 12px; border: 1px dashed var(--border-color); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; opacity: 0; visibility: hidden; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .detail-modal-box { background: #12151e; border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; position: relative; }
    .detail-cover-img { width: 100%; max-height: 260px; object-fit: cover; border-top-left-radius: 20px; border-top-right-radius: 20px; }
    .detail-body { padding: 20px; }
    .detail-title { font-size: 1.25rem; font-weight: 800; color: #fff; margin-bottom: 12px; text-transform: uppercase; }
    .detail-price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
    .detail-price { font-size: 1.25rem; font-weight: 800; color: #ef4444; }
    .btn-wa-direct { background: var(--wa-green); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
    .detail-desc-text { font-size: 0.85rem; color: #cbd5e1; line-height: 1.7; white-space: pre-wrap; }
    .popup-close-circle { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.08); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="detail-modal-overlay" class="modal-overlay">
    <div class="detail-modal-box">
      <button class="popup-close-circle" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
      <img id="modal-detail-img" src="" alt="Cover" class="detail-cover-img">
      <div class="detail-body">
        <h2 id="modal-detail-title" class="detail-title">Nama Produk</h2>
        <div class="detail-price-row">
          <div id="modal-detail-price" class="detail-price">Rp 0</div>
          <a id="modal-detail-wa-btn" href="#" target="_blank" class="btn-wa-direct">
            <i class="fa-brands fa-whatsapp fa-lg"></i> Beli via WA
          </a>
        </div>
        <div id="modal-detail-desc" class="detail-desc-text">Deskripsi lengkap...</div>
      </div>
    </div>
  </div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img id="main-logo" src="https://via.placeholder.com/150" alt="Logo">
        <span class="site-brand-name">PRIME CT</span>
      </a>
      <a href="#" class="wa-link nav-btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> CS WhatsApp</a>
    </div>
  </header>

  <div class="container">
    <a href="index.html" class="back-portal-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Menu Utama</a>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Cari produk atau layanan..." onkeyup="filterItems()">
    </div>

    <div class="category-tabs">
      <button class="tab-btn active" onclick="switchCategory('all', this)"><i class="fa-solid fa-border-all"></i> Semua</button>
      <button class="tab-btn" onclick="switchCategory('products', this)"><i class="fa-solid fa-box"></i> Produk</button>
      <button class="tab-btn" onclick="switchCategory('services', this)"><i class="fa-solid fa-headset"></i> Layanan / Jasa</button>
    </div>

    <div id="product-section">
      <h2 class="section-title"><i class="fa-solid fa-bolt rgb-title" style="color: #f59e0b;"></i> Daftar Produk</h2>
      <div id="products-container" class="grid-container">
        <div class="state-msg">Memuat daftar produk...</div>
      </div>
    </div>

    <div id="service-section">
      <h2 class="section-title"><i class="fa-solid fa-shield-halved rgb-title" style="color: #3b82f6;"></i> Layanan & Jasa</h2>
      <div id="services-container" class="grid-container">
        <div class="state-msg">Memuat daftar layanan...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://krxzhxxytjmqmvzndofw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BtMu9ACi_o-V29IdGZdIDA_th6tjNzi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeWhatsappNumber = '';
    let globalProducts = [];
    let globalServices = [];

    function closeDetailModal() { document.getElementById('detail-modal-overlay').classList.remove('active'); }

    function openProductDetail(id) {
      const prod = globalProducts.find(p => p.id === id);
      if (!prod) return;
      const priceFormatted = Number(prod.price).toLocaleString('id-ID');
      const waText = encodeURIComponent(`Halo Admin, saya mau pesan produk: ${prod.name}`);
      const waUrl = activeWhatsappNumber ? `https://wa.me/${activeWhatsappNumber}?text=${waText}` : '#';

      document.getElementById('modal-detail-img').src = prod.image_url || 'https://via.placeholder.com/300';
      document.getElementById('modal-detail-title').textContent = prod.name;
      document.getElementById('modal-detail-price').textContent = `Rp ${priceFormatted}`;
      document.getElementById('modal-detail-desc').textContent = prod.description || 'Tidak ada deskripsi.';
      document.getElementById('modal-detail-wa-btn').href = waUrl;
      document.getElementById('detail-modal-overlay').classList.add('active');
    }

    function openServiceDetail(id) {
      const serv = globalServices.find(s => s.id === id);
      if (!serv) return;
      const waText = encodeURIComponent(`Halo Admin, saya mau pesan jasa: ${serv.title}`);
      const waUrl = activeWhatsappNumber ? `https://wa.me/${activeWhatsappNumber}?text=${waText}` : '#';

      document.getElementById('modal-detail-img').src = 'https://via.placeholder.com/300?text=Jasa+%26+Layanan';
      document.getElementById('modal-detail-title').textContent = serv.title;
      document.getElementById('modal-detail-price').textContent = 'Layanan / Jasa';
      document.getElementById('modal-detail-desc').textContent = serv.description || 'Tidak ada deskripsi.';
      document.getElementById('modal-detail-wa-btn').href = waUrl;
      document.getElementById('detail-modal-overlay').classList.add('active');
    }

    async function loadSettings() {
      const { data } = await supabaseClient.from('site_settings').select('*');
      if (!data) return;
      data.forEach(item => {
        if (item.key === 'site_title' && item.value) {
          document.title = `${item.value} - Produk`;
          document.querySelectorAll('.site-brand-name').forEach(el => el.textContent = item.value);
        }
        if (item.key === 'logo_url' && item.value) {
          const logoEl = document.getElementById('main-logo');
          if (logoEl) logoEl.src = item.value;
        }
        if (item.key === 'whatsapp_number' && item.value) {
          activeWhatsappNumber = item.value;
          document.querySelectorAll('.wa-link').forEach(btn => btn.href = `https://wa.me/${item.value}`);
        }
      });
    }

    async function loadPublicProducts() {
      const container = document.getElementById('products-container');
      const { data: products } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (!products || products.length === 0) {
        container.innerHTML = '<div class="state-msg">Belum ada produk.</div>';
        globalProducts = [];
      } else {
        globalProducts = products;
        renderProducts(products);
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('products-container');
      container.innerHTML = products.map(prod => `
        <div onclick="openProductDetail('${prod.id}')" class="store-card">
          <span class="card-badge">PROMO</span>
          <img class="card-img" src="${prod.image_url || 'https://via.placeholder.com/150'}" alt="${prod.name}">
          <div>
            <div class="card-title">${prod.name}</div>
            <div class="card-desc">${prod.description || ''}</div>
            <div class="card-price">Rp ${Number(prod.price).toLocaleString('id-ID')}</div>
          </div>
          <div class="card-btn">Lihat Detail</div>
        </div>
      `).join('');
    }

    async function loadPublicServices() {
      const container = document.getElementById('services-container');
      const { data: services } = await supabaseClient.from('services').select('*').order('created_at', { ascending: false });
      if (!services || services.length === 0) {
        container.innerHTML = '<div class="state-msg">Belum ada layanan.</div>';
        globalServices = [];
      } else {
        globalServices = services;
        renderServices(services);
      }
    }

    function renderServices(services) {
      const container = document.getElementById('services-container');
      container.innerHTML = services.map(serv => `
        <div onclick="openServiceDetail('${serv.id}')" class="store-card">
          <span class="card-badge" style="background:#059669;">JASA</span>
          <div>
            <div class="card-title" style="margin-top:8px;">${serv.title}</div>
            <div class="card-desc">${serv.description || ''}</div>
          </div>
          <div class="card-btn" style="background:#059669;">Lihat Detail</div>
        </div>
      `).join('');
    }

    function filterItems() {
      const query = document.getElementById('search-input').value.toLowerCase();
      renderProducts(globalProducts.filter(p => p.name.toLowerCase().includes(query)));
      renderServices(globalServices.filter(s => s.title.toLowerCase().includes(query)));
    }

    function switchCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('product-section').style.display = (cat === 'services') ? 'none' : 'block';
      document.getElementById('service-section').style.display = (cat === 'products') ? 'none' : 'block';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadSettings();
      loadPublicProducts();
      loadPublicServices();
    });
  </script>
</body>
</html>
