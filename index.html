<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title class="site-brand-name">PRIME CT STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #090b10;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f6fc;
      --text-sub: #94a3b8;
      --wa-green: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg-body);
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090b10 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    @keyframes rgbGlowText {
      0% { color: #ff3366; filter: drop-shadow(0 0 10px rgba(255, 51, 102, 0.5)); }
      25% { color: #38bdf8; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); }
      50% { color: #a855f7; filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5)); }
      75% { color: #34d399; filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.5)); }
      100% { color: #ff3366; filter: drop-shadow(0 0 10px rgba(255, 51, 102, 0.5)); }
    }
    .portal-card {
      background: linear-gradient(135deg, #2e1065 0%, #0f172a 100%);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 35px 25px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .portal-avatar {
      width: 85px; height: 85px;
      margin: 0 auto 15px auto;
      border-radius: 20px;
      border: 2px solid rgba(168, 85, 247, 0.5);
      overflow: hidden;
      background: #1e1b2e;
    }
    .portal-avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
      animation: rgbGlowText 6s infinite linear;
      -webkit-text-fill-color: initial;
    }
    p { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 25px; line-height: 1.5; }
    .portal-buttons { display: flex; flex-direction: column; gap: 12px; }
    .p-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 13px 20px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: 0.2s;
      display: block;
      text-align: center;
    }
    .p-btn.primary {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      border-color: rgba(167, 139, 250, 0.4);
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    }
    .p-btn:hover { transform: scale(1.02); opacity: 0.95; }

    /* MODAL WA */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; opacity: 0; visibility: hidden; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .popup-wa-card { background: linear-gradient(180deg, #180d2a 0%, #0c0d14 100%); border: 1px solid rgba(139, 92, 246, 0.25); border-radius: 28px; width: 100%; max-width: 380px; padding: 32px 24px 28px 24px; text-align: center; position: relative; }
    .popup-close-circle { position: absolute; top: 18px; right: 18px; background: rgba(255, 255, 255, 0.08); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
    .popup-avatar-box { width: 85px; height: 85px; margin: 10px auto 20px auto; border-radius: 20px; overflow: hidden; border: 2px solid rgba(168, 85, 247, 0.5); }
    .popup-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .popup-title { font-size: 1.15rem; font-weight: 800; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
    .popup-desc { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
    .popup-btn-join { display: block; width: 100%; background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; text-decoration: none; padding: 14px; border-radius: 14px; font-weight: 700; margin-bottom: 10px; }
    .popup-btn-later { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #fff; padding: 13px; border-radius: 14px; font-weight: 700; cursor: pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- MODAL POPUP WA -->
  <div id="wa-modal-overlay" class="modal-overlay">
    <div class="popup-wa-card">
      <button class="popup-close-circle" onclick="closeWaModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="popup-avatar-box"><img id="modal-banner-img" src="https://via.placeholder.com/150" alt=""></div>
      <h3 id="modal-popup-title" class="popup-title">JOIN GRUP WHATSAPP</h3>
      <p id="modal-popup-desc" class="popup-desc">Masuk grup WhatsApp resmi untuk info promo & update produk.</p>
      <a id="modal-group-btn" href="#" target="_blank" class="popup-btn-join">Join Grup</a>
      <button class="popup-btn-later" onclick="closeWaModal()">Nanti</button>
    </div>
  </div>

  <div class="portal-card">
    <div class="portal-avatar">
      <img id="portal-logo" src="https://via.placeholder.com/150" alt="Logo">
    </div>
    <h1 id="portal-title">PRIME CT STORE</h1>
    <p id="portal-desc">Platform digital terpercaya untuk kebutuhan akun premium, jasa editing, top up game, bot WhatsApp, dan layanan digital lainnya.</p>
    
    <div class="portal-buttons">
      <!-- TOMBOL INI MENGARAH KE WEB PRODUK YANG BERBEDA FILE, MISAL: produk.html -->
      <a href="produk.html" class="p-btn primary">Lihat Produk</a>
      <a id="portal-owner-btn" href="#" target="_blank" class="p-btn">Hubungi Owner</a>
      <a id="portal-tools-btn" href="#" target="_blank" class="p-btn">YNA TOOLS</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://krxzhxxytjmqmvzndofw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BtMu9ACi_o-V29IdGZdIDA_th6tjNzi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function closeWaModal() { document.getElementById('wa-modal-overlay').classList.remove('active'); }

    async function loadPortalSettings() {
      const { data } = await supabaseClient.from('site_settings').select('*');
      if (!data) return;

      let isPopupEnabled = false;
      let groupUrl = '#';

      data.forEach(item => {
        if (item.key === 'site_title' && item.value) {
          document.title = item.value;
          document.querySelectorAll('.site-brand-name').forEach(el => el.textContent = item.value);
        }
        if (item.key === 'logo_url' && item.value) {
          document.getElementById('portal-logo').src = item.value;
        }
        if (item.key === 'hero_title' && item.value) {
          document.getElementById('portal-title').textContent = item.value;
        }
        if (item.key === 'hero_desc' && item.value) {
          document.getElementById('portal-desc').textContent = item.value;
        }
        if (item.key === 'whatsapp_number' && item.value) {
          document.getElementById('portal-owner-btn').href = `https://wa.me/${item.value}`;
        }
        if (item.key === 'ynatools_link' && item.value) {
          document.getElementById('portal-tools-btn').href = item.value;
        }
        if (item.key === 'popup_enabled') isPopupEnabled = (item.value === 'true');
        if (item.key === 'popup_title' && item.value) document.getElementById('modal-popup-title').textContent = item.value;
        if (item.key === 'popup_desc' && item.value) document.getElementById('modal-popup-desc').textContent = item.value;
        if (item.key === 'wa_group_link' && item.value) {
          groupUrl = item.value;
          document.getElementById('modal-group-btn').href = item.value;
        }
        if (item.key === 'popup_banner_url' && item.value) {
          document.getElementById('modal-banner-img').src = item.value;
        }
      });

      if (isPopupEnabled && groupUrl !== '#') {
        setTimeout(() => document.getElementById('wa-modal-overlay').classList.add('active'), 500);
      }
    }

    loadPortalSettings();
  </script>
</body>
</html>
