<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title class="site-brand-name">PRIME CT STORE</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --wa-color: #25d366;
      --wa-hover: #1da851;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* HEADER & NAVBAR */
    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand img {
      width: 45px;
      height: 45px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--card-border);
    }

    .brand span {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .btn-wa-nav {
      background-color: var(--wa-color);
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-wa-nav:hover {
      background-color: var(--wa-hover);
      transform: translateY(-2px);
    }

    /* CONTAINER UTAMA */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 30px 20px 50px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 15px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 25px;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      width: 5px;
      height: 24px;
      background: var(--accent-color);
      border-radius: 4px;
    }

    /* GRID DISPLAY */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    /* PRODUCT CARD */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #0f172a;
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    .btn-buy {
      background: var(--accent-color);
      color: #fff;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-buy:hover {
      background: var(--accent-hover);
    }

    /* SERVICE CARD */
    .service-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      transition: transform 0.2s ease;
    }

    .service-card:hover {
      transform: translateY(-3px);
    }

    .service-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f1f5f9;
    }

    .service-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* LOADING & EMPTY STATE */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px dashed var(--card-border);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--card-border);
      padding: 30px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>

  <!-- CDN Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <img id="main-logo" src="https://via.placeholder.com/150" alt="Logo">
        <span class="site-brand-name">PRIME CT STORE</span>
      </a>
      <a href="#" class="wa-link btn-wa-nav" target="_blank">
        WhatsApp Admin
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="container">

    <!-- HERO SECTION -->
    <div class="hero">
      <h1 class="site-brand-name">PRIME CT STORE</h1>
      <p>Penyedia Produk & Layanan Terbaik dan Terpercaya. Pilih produk pilihan Anda dan pesan langsung secara praktis melalui WhatsApp!</p>
    </div>

    <!-- PRODUCT SECTION -->
    <h2 class="section-title">Daftar Produk</h2>
    <div id="products-container" class="grid-container">
      <div class="state-msg">Memuat daftar produk...</div>
    </div>

    <!-- SERVICES SECTION -->
    <h2 class="section-title">Layanan & Jasa</h2>
    <div id="services-container" class="grid-container">
      <div class="state-msg">Memuat daftar layanan...</div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; <span id="year"></span> <span class="site-brand-name">PRIME CT STORE</span>. All rights reserved.</p>
  </footer>

  <!-- SUPABASE INTEGRATION SCRIPT -->
  <script>
    // Set Tahun di Footer
    document.getElementById('year').textContent = new Date().getFullYear();

    // Configuration Supabase
    const SUPABASE_URL = 'https://krxzhxxytjmqmvzndofw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BtMu9ACi_o-V29IdGZdIDA_th6tjNzi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeWhatsappNumber = '';

    // 1. Load Website Settings (Judul, Logo, WA)
    async function loadWebsiteSettings() {
      const { data, error } = await supabaseClient.from('site_settings').select('*');
      if (error || !data) return;

      data.forEach(item => {
        // Nama Toko / Judul
        if (item.key === 'site_title' && item.value) {
          document.title = item.value;
          document.querySelectorAll('.site-brand-name').forEach(el => el.textContent = item.value);
        }

        // Logo
        if (item.key === 'logo_url' && item.value) {
          const logoEl = document.getElementById('main-logo');
          if (logoEl) logoEl.src = item.value;
        }

        // WhatsApp
        if (item.key === 'whatsapp_number' && item.value) {
          activeWhatsappNumber = item.value;
          document.querySelectorAll('.wa-link').forEach(btn => {
            btn.href = `https://wa.me/${item.value}?text=Halo%20Admin,%20saya%20ingin%20bertanya`;
          });
        }
      });
    }

    // 2. Load Products
    async function loadPublicProducts() {
      const container = document.getElementById('products-container');
      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !products || products.length === 0) {
        container.innerHTML = '<div class="state-msg">Belum ada produk yang tersedia saat ini.</div>';
        return;
      }

      container.innerHTML = products.map(prod => {
        const priceFormatted = Number(prod.price).toLocaleString('id-ID');
        const waText = encodeURIComponent(`Halo, saya tertarik untuk membeli produk: ${prod.name}`);
        const waUrl = activeWhatsappNumber 
          ? `https://wa.me/${activeWhatsappNumber}?text=${waText}`
          : '#';

        return `
          <div class="product-card">
            <img class="product-img" src="${prod.image_url || 'https://via.placeholder.com/300'}" alt="${prod.name}">
            <div class="product-info">
              <h3 class="product-title">${prod.name}</h3>
              <p class="product-desc">${prod.description || 'Tidak ada deskripsi.'}</p>
              <div class="product-price">Rp ${priceFormatted}</div>
              <a href="${waUrl}" class="btn-buy" target="_blank">Beli Sekarang</a>
            </div>
          </div>
        `;
      }).join('');
    }

    // 3. Load Services
    async function loadPublicServices() {
      const container = document.getElementById('services-container');
      const { data: services, error } = await supabaseClient
        .from('services')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !services || services.length === 0) {
        container.innerHTML = '<div class="state-msg">Belum ada layanan yang ditawarkan saat ini.</div>';
        return;
      }

      container.innerHTML = services.map(serv => `
        <div class="service-card">
          <h3 class="service-title">${serv.title}</h3>
          <p class="service-desc">${serv.description || 'Tidak ada deskripsi.'}</p>
        </div>
      `).join('');
    }

    // Jalankan semua pengambilan data
    document.addEventListener('DOMContentLoaded', async () => {
      await loadWebsiteSettings();
      loadPublicProducts();
      loadPublicServices();
    });
  </script>
</body>
</html>
