<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - YNA Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #090b10;
      --bg-card: #141824;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --text-main: #f0f6fc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; color: #a78bfa; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; background: #0c0e14; border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none; }
    .form-group textarea { resize: vertical; height: 80px; }
    
    .btn { background: #7c3aed; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-gauge-high"></i> Admin Panel YNA</h1>

    <!-- PENGATURAN SITUS & LANDING PAGE -->
    <div class="card">
      <h3>Pengaturan Landing Page & Kontak</h3>
      <div class="form-group">
        <label>Judul Web (Site Title)</label>
        <input type="text" id="set-site_title">
      </div>
      <div class="form-group">
        <label>URL Logo Utama</label>
        <input type="text" id="set-logo_url">
      </div>
      <div class="form-group">
        <label>URL Background (Video MP4 / Gambar)</label>
        <input type="text" id="set-bg_media_url" placeholder="https://.../video.mp4 atau link gambar">
      </div>
      <div class="form-group">
        <label>Judul Hero / Sambutan</label>
        <input type="text" id="set-hero_title">
      </div>
      <div class="form-group">
        <label>Deskripsi Hero</label>
        <textarea id="set-hero_desc"></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Nomor WhatsApp Utama</label>
          <input type="text" id="set-whatsapp_number" placeholder="628xxxxxxxx">
        </div>
        <div class="form-group">
          <label>WhatsApp Cadangan</label>
          <input type="text" id="set-whatsapp_backup">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Email Kontak</label>
          <input type="text" id="set-email_contact">
        </div>
        <div class="form-group">
          <label>Link Instagram</label>
          <input type="text" id="set-instagram_link">
        </div>
      </div>
      <div class="form-group">
        <label>Link Telegram</label>
        <input type="text" id="set-telegram_link">
      </div>
      <button class="btn" onclick="saveSettings(['site_title', 'logo_url', 'bg_media_url', 'hero_title', 'hero_desc', 'whatsapp_number', 'whatsapp_backup', 'email_contact', 'instagram_link', 'telegram_link'])">Simpan Perubahan Landing</button>
    </div>

    <!-- PENGATURAN LINK MENU & TOOLS -->
    <div class="card">
      <h3>Pengaturan Link Tombol & Menu</h3>
      <div class="form-group">
        <label>Link YNA Tools</label>
        <input type="text" id="set-ynatools_link">
      </div>
      <div class="form-group">
        <label>Link YNA Cpanel</label>
        <input type="text" id="set-ynacpanel_link">
      </div>
      <div class="form-group">
        <label>Link YNA Convert</label>
        <input type="text" id="set-ynaconvert_link">
      </div>
      <div class="form-group">
        <label>Link YNA AI</label>
        <input type="text" id="set-ynaai_link">
      </div>
      <button class="btn" onclick="saveSettings(['ynatools_link', 'ynacpanel_link', 'ynaconvert_link', 'ynaai_link'])">Simpan Link Menu</button>
    </div>

    <!-- PENGATURAN PAYMENT -->
    <div class="card">
      <h3>Pengaturan Metode Pembayaran (Payment Modal)</h3>
      <div class="form-group">
        <label>URL Gambar QRIS</label>
        <input type="text" id="set-qris_image_url">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Nomor DANA</label>
          <input type="text" id="set-dana_number">
        </div>
        <div class="form-group">
          <label>Nama Akun DANA</label>
          <input type="text" id="set-dana_name">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Nomor GoPay</label>
          <input type="text" id="set-gopay_number">
        </div>
        <div class="form-group">
          <label>Nama Akun GoPay</label>
          <input type="text" id="set-gopay_name">
        </div>
      </div>
      <button class="btn" onclick="saveSettings(['qris_image_url', 'dana_number', 'dana_name', 'gopay_number', 'gopay_name'])">Simpan Pengaturan Payment</button>
    </div>

    <!-- PENGATURAN POPUP WA -->
    <div class="card">
      <h3>Pengaturan Popup Grup WhatsApp</h3>
      <div class="form-group">
        <label>Aktifkan Popup (true / false)</label>
        <input type="text" id="set-popup_enabled" placeholder="true atau false">
      </div>
      <div class="form-group">
        <label>Judul Popup</label>
        <input type="text" id="set-popup_title">
      </div>
      <div class="form-group">
        <label>Deskripsi Popup</label>
        <textarea id="set-popup_desc"></textarea>
      </div>
      <div class="form-group">
        <label>Link URL Grup WhatsApp</label>
        <input type="text" id="set-wa_group_link">
      </div>
      <div class="form-group">
        <label>URL Banner Gambar Popup</label>
        <input type="text" id="set-popup_banner_url">
      </div>
      <button class="btn" onclick="saveSettings(['popup_enabled', 'popup_title', 'popup_desc', 'wa_group_link', 'popup_banner_url'])">Simpan Popup WA</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://krxzhxxytjmqmvzndofw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BtMu9ACi_o-V29IdGZdIDA_th6tjNzi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAdminSettings() {
      const { data } = await supabaseClient.from('site_settings').select('*');
      if (!data) return;
      data.forEach(item => {
        const input = document.getElementById(`set-${item.key}`);
        if (input) input.value = item.value || '';
      });
    }

    async function saveSettings(keys) {
      for (let key of keys) {
        const val = document.getElementById(`set-${key}`).value;
        await supabaseClient.from('site_settings').upsert({ key: key, value: val }, { onConflict: 'key' });
      }
      alert('Pengaturan berhasil disimpan!');
    }

    loadAdminSettings();
  </script>
</body>
</html>
