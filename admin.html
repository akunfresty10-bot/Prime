<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - PRIME CT STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #090b10;
      --bg-card: #141824;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --text-main: #f0f6fc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
    
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    input, textarea, select { width: 100%; padding: 10px 14px; background: #0c0f17; border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 0.88rem; outline: none; }
    textarea { resize: vertical; min-height: 80px; }
    
    .btn { background: #7c3aed; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; }
    .btn-success { background: #059669; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-row { background: #0c0f17; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .item-info { font-size: 0.88rem; font-weight: 700; }
    .item-sub { font-size: 0.75rem; color: var(--text-sub); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-gauge"></i> Admin Panel PRIME CT STORE</h1>

    <!-- PENGATURAN WEBSITE & PAYMENT -->
    <div class="card">
      <h2>Pengaturan Website, Kontak & Payment</h2>
      <form id="settings-form" onsubmit="saveSettings(event)">
        <div class="form-group">
          <label>Nama Brand Store</label>
          <input type="text" id="set_site_title">
        </div>
        <div class="form-group">
          <label>URL Logo Utama</label>
          <input type="text" id="set_logo_url">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Nomor WhatsApp Utama</label>
            <input type="text" id="set_whatsapp_number">
          </div>
          <div class="form-group">
            <label>WhatsApp Cadangan</label>
            <input type="text" id="set_contact_wa_2">
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Email Kontak</label>
            <input type="text" id="set_contact_email">
          </div>
          <div class="form-group">
            <label>Link YNA TOOLS</label>
            <input type="text" id="set_ynatools_link">
          </div>
        </div>

        <h3 style="font-size:0.95rem; font-weight:700; color:#fff; margin: 16px 0 10px 0;">Pengaturan Metode Pembayaran</h3>
        <div class="form-group">
          <label>URL Gambar QRIS</label>
          <input type="text" id="set_qris_image_url">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Nomor DANA</label>
            <input type="text" id="set_dana_number">
          </div>
          <div class="form-group">
            <label>Atas Nama DANA</label>
            <input type="text" id="set_dana_name">
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Nomor GoPay</label>
            <input type="text" id="set_gopay_number">
          </div>
          <div class="form-group">
            <label>Atas Nama GoPay</label>
            <input type="text" id="set_gopay_name">
          </div>
        </div>

        <button type="submit" class="btn">Simpan Pengaturan</button>
      </form>
    </div>

    <!-- KELOLA PRODUK -->
    <div class="card">
      <h2>Kelola Produk</h2>
      <form id="product-form" onsubmit="saveProduct(event)" style="margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:15px;">
        <input type="hidden" id="prod_id">
        <div class="grid-2">
          <div class="form-group">
            <label>Nama Produk</label>
            <input type="text" id="prod_name" required>
          </div>
          <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="prod_price" required>
          </div>
        </div>
        <div class="form-group">
          <label>URL Gambar Produk</label>
          <input type="text" id="prod_image">
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea id="prod_desc"></textarea>
        </div>
        <button type="submit" class="btn btn-success" id="prod-submit-btn">Tambah Produk</button>
      </form>
      <div id="admin-products-list">Memuat produk...</div>
    </div>

    <!-- KELOLA LAYANAN -->
    <div class="card">
      <h2>Kelola Layanan / Jasa</h2>
      <form id="service-form" onsubmit="saveService(event)" style="margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:15px;">
        <input type="hidden" id="serv_id">
        <div class="form-group">
          <label>Judul Layanan</label>
          <input type="text" id="serv_title" required>
        </div>
        <div class="form-group">
          <label>Deskripsi Layanan</label>
          <textarea id="serv_desc"></textarea>
        </div>
        <button type="submit" class="btn btn-success" id="serv-submit-btn">Tambah Layanan</button>
      </form>
      <div id="admin-services-list">Memuat layanan...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://krxzhxxytjmqmvzndofw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BtMu9ACi_o-V29IdGZdIDA_th6tjNzi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadSettings() {
      const { data } = await supabaseClient.from('site_settings').select('*');
      if (!data) return;
      data.forEach(item => {
        const el = document.getElementById(`set_${item.key}`);
        if (el) el.value = item.value || '';
      });
    }

    async function saveSettings(e) {
      e.preventDefault();
      const keys = [
        'site_title', 'logo_url', 'whatsapp_number', 'contact_wa_2', 
        'contact_email', 'ynatools_link', 'qris_image_url', 
        'dana_number', 'dana_name', 'gopay_number', 'gopay_name'
      ];

      for (const key of keys) {
        const val = document.getElementById(`set_${key}`).value;
        await supabaseClient.from('site_settings').upsert({ key, value: val }, { onConflict: 'key' });
      }
      alert('Pengaturan berhasil disimpan!');
    }

    async function loadAdminProducts() {
      const { data } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('admin-products-list');
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="item-sub">Belum ada produk.</div>';
        return;
      }
      container.innerHTML = data.map(p => `
        <div class="item-row">
          <div>
            <div class="item-info">${p.name} - Rp ${Number(p.price).toLocaleString('id-ID')}</div>
            <div class="item-sub">${p.description ? p.description.substring(0,40) + '...' : ''}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn" style="padding:6px 10px; font-size:0.75rem;" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
            <button class="btn btn-danger" style="padding:6px 10px; font-size:0.75rem;" onclick="deleteProduct('${p.id}')">Hapus</button>
          </div>
        </div>
      `).join('');
    }

    async function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('prod_id').value;
      const name = document.getElementById('prod_name').value;
      const price = document.getElementById('prod_price').value;
      const image_url = document.getElementById('prod_image').value;
      const description = document.getElementById('prod_desc').value;

      const payload = { name, price: Number(price), image_url, description };
      if (id) {
        await supabaseClient.from('products').update(payload).eq('id', id);
      } else {
        await supabaseClient.from('products').insert([payload]);
      }
      document.getElementById('product-form').reset();
      document.getElementById('prod_id').value = '';
      document.getElementById('prod-submit-btn').textContent = 'Tambah Produk';
      loadAdminProducts();
    }

    function editProduct(p) {
      document.getElementById('prod_id').value = p.id;
      document.getElementById('prod_name').value = p.name;
      document.getElementById('prod_price').value = p.price;
      document.getElementById('prod_image').value = p.image_url || '';
      document.getElementById('prod_desc').value = p.description || '';
      document.getElementById('prod-submit-btn').textContent = 'Update Produk';
      window.scrollTo({ top: 400, behavior: 'smooth' });
    }

    async function deleteProduct(id) {
      if (confirm('Yakin ingin hapus produk ini?')) {
        await supabaseClient.from('products').delete().eq('id', id);
        loadAdminProducts();
      }
    }

    async function loadAdminServices() {
      const { data } = await supabaseClient.from('services').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('admin-services-list');
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="item-sub">Belum ada layanan.</div>';
        return;
      }
      container.innerHTML = data.map(s => `
        <div class="item-row">
          <div>
            <div class="item-info">${s.title}</div>
            <div class="item-sub">${s.description ? s.description.substring(0,40) + '...' : ''}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn" style="padding:6px 10px; font-size:0.75rem;" onclick='editService(${JSON.stringify(s)})'>Edit</button>
            <button class="btn btn-danger" style="padding:6px 10px; font-size:0.75rem;" onclick="deleteService('${s.id}')">Hapus</button>
          </div>
        </div>
      `).join('');
    }

    async function saveService(e) {
      e.preventDefault();
      const id = document.getElementById('serv_id').value;
      const title = document.getElementById('serv_title').value;
      const description = document.getElementById('serv_desc').value;

      const payload = { title, description };
      if (id) {
        await supabaseClient.from('services').update(payload).eq('id', id);
      } else {
        await supabaseClient.from('services').insert([payload]);
      }
      document.getElementById('service-form').reset();
      document.getElementById('serv_id').value = '';
      document.getElementById('serv-submit-btn').textContent = 'Tambah Layanan';
      loadAdminServices();
    }

    function editService(s) {
      document.getElementById('serv_id').value = s.id;
      document.getElementById('serv_title').value = s.title;
      document.getElementById('serv_desc').value = s.description || '';
      document.getElementById('serv-submit-btn').textContent = 'Update Layanan';
      window.scrollTo({ top: 800, behavior: 'smooth' });
    }

    async function deleteService(id) {
      if (confirm('Yakin ingin hapus layanan ini?')) {
        await supabaseClient.from('services').delete().eq('id', id);
        loadAdminServices();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      loadAdminProducts();
      loadAdminServices();
    });
  </script>
</body>
</html>
