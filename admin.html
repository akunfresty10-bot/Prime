<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Admin Panel - PRIME CT</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #090b10;
      --bg-card: #141824;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --text-main: #f0f6fc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; }

    /* FLOATING ADMIN BAR */
    .admin-floating-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20, 24, 36, 0.95);
      border: 1px solid var(--accent-purple);
      padding: 12px 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(10px);
    }
    .admin-floating-bar span { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .btn-save-live {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-save-live:hover { opacity: 0.9; }

    /* EDITABLE HIGHLIGHT MODE */
    [contenteditable="true"] {
      outline: 2px dashed rgba(139, 92, 246, 0.5);
      outline-offset: 4px;
      border-radius: 4px;
      background: rgba(139, 92, 246, 0.05);
      transition: 0.2s;
    }
    [contenteditable="true"]:focus {
      outline: 2px solid var(--accent-purple);
      background: rgba(139, 92, 246, 0.1);
    }

    /* AUTH SCREEN */
    #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-body); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; width: 100%; max-width: 400px; padding: 32px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
    .auth-title { font-size: 1.35rem; font-weight: 800; color: #fff; margin-bottom: 6px; text-align: center; }
    .auth-subtitle { font-size: 0.85rem; color: var(--text-sub); text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; }
    .form-input:focus { border-color: var(--accent-purple); }
    .btn-primary { background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }

    /* LAYOUT UTAMA WEBSITE PUBLIK (CONTOH) */
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; border-bottom: 1px solid var(--border-color); }
    .logo { font-size: 1.25rem; font-weight: 800; color: #fff; }
    .hero { text-align: center; padding: 100px 20px; }
    .hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 20px; color: #fff; }
    .hero p { font-size: 1.1rem; color: var(--text-sub); max-width: 600px; margin: 0 auto; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- LOGIN SCREEN KHUSUS ADMIN -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2 class="auth-title">PRIME CT Live Editor</h2>
      <p class="auth-subtitle">Login untuk mulai mengedit web secara langsung.</p>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="auth-email" class="form-input" placeholder="admin@primect.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="auth-password" class="form-input" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="handleLogin()">Masuk ke Mode Edit</button>
      <div id="auth-msg" style="margin-top: 15px; font-size: 0.8rem; text-align: center; color: #ef4444;"></div>
    </div>
  </div>

  <!-- FLOATING BAR UNTUK SAVE -->
  <div class="admin-floating-bar">
    <span><i class="fa-solid fa-pen-to-square" style="color: var(--accent-purple);"></i> Mode Edit Aktif</span>
    <button class="btn-save-live" onclick="saveLiveChanges()">Simpan Perubahan</button>
  </div>

  <!-- TAMPILAN WEB PUBLIK YANG BISA DI-KLIK & DI-KETIK LANGSUNG -->
  <header>
    <div class="logo" id="editable-site_title" contenteditable="true">PRIME CT</div>
    <div style="font-size: 0.9rem; color: var(--text-sub);">Klik teks bergaris putus-putus untuk mengubahnya.</div>
  </header>

  <section class="hero">
    <h1 id="editable-hero_title" contenteditable="true">Solusi Digital & Teknologi Terpadu</h1>
    <p id="editable-hero_desc" contenteditable="true">Platform layanan profesional terbaik untuk kebutuhan teknologi dan bisnis Anda.</p>
  </section>

  <script>
    const SUPABASE_URL = 'https://krxzhxxytjmqmvzndofw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BtMu9ACi_o-V29IdGZdIDA_th6tjNzi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('auth-msg').textContent = error.message;
      } else {
        document.getElementById('auth-screen').style.display = 'none';
        loadLiveData();
      }
    }

    async function loadLiveData() {
      const { data } = await supabaseClient.from('site_settings').select('*');
      if (!data) return;
      data.forEach(item => {
        const el = document.getElementById(`editable-${item.key}`);
        if (el) el.textContent = item.value || '';
      });
    }

    async function saveLiveChanges() {
      const keys = ['site_title', 'hero_title', 'hero_desc'];
      
      for (let key of keys) {
        const el = document.getElementById(`editable-${key}`);
        if (el) {
          const val = el.textContent.trim();
          await supabaseClient.from('site_settings').upsert({ key, value: val }, { onConflict: 'key' });
        }
      }
      alert('Perubahan berhasil disimpan! Tampilan publik sekarang sudah diperbarui.');
    }

    // Cek sesi saat halaman dimuat
    async function checkAuthSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('auth-screen').style.display = 'none';
        loadLiveData();
      }
    }
    checkAuthSession();
  </script>
</body>
</html>
