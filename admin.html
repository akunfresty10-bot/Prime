<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Control Center</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2, h3 { color: #2c3e50; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
    }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    button.btn-danger { background: #dc3545; }
    button.btn-danger:hover { background: #bd2130; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; }
    img.preview { max-width: 80px; max-height: 80px; object-fit: cover; border-radius: 4px; }
    .header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9ecef; padding-bottom: 15px; margin-bottom: 20px; }
  </style>

  <!-- CDN Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">

    <!-- ========================================== -->
    <!-- 1. FORM LOGIN ADMIN                        -->
    <!-- ========================================== -->
    <div id="login-section" class="card" style="max-width: 400px; margin: 80px auto;">
      <h2>Login Admin</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email Admin</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" style="width: 100%;">Masuk Panel Admin</button>
      </form>
      <p id="auth-error" style="color: red; margin-top: 10px; text-align: center;"></p>
    </div>


    <!-- ========================================== -->
    <!-- 2. DASHBOARD ADMIN (Tampil jika sudah login)-->
    <!-- ========================================== -->
    <div id="admin-dashboard" style="display: none;">
      
      <!-- Header Admin -->
      <div class="card header-admin">
        <div>
          <h2 style="margin:0;">Dashboard Admin</h2>
          <small id="user-email" style="color: #6c757d;"></small>
        </div>
        <button id="logout-btn" class="btn-danger">Logout</button>
      </div>

      <!-- SECTION A: PENGATURAN UMUM WEBSITE -->
      <div class="card">
        <h3>1. Pengaturan Umum Website</h3>
        <form id="settings-form">
          <div class="form-group">
            <label>Judul Website / Nama Toko</label>
            <input type="text" id="site_title" placeholder="Contoh: Toko Berkah Mandiri">
          </div>
          <div class="form-group">
            <label>Nomor WhatsApp (Gunakan Format 62, contoh: 6281234567890)</label>
            <input type="text" id="whatsapp_number" placeholder="6281234567890">
          </div>
          <div class="form-group">
            <label>Upload Logo Baru (Opsional)</label>
            <input type="file" id="logo_file" accept="image/*">
            <div id="current-logo-container" style="margin-top: 10px;"></div>
          </div>
          <button type="submit">Simpan Pengaturan</button>
        </form>
      </div>

      <!-- SECTION B: KELOLA PRODUK -->
      <div class="card">
        <h3>2. Kelola Produk</h3>
        <form id="product-form" style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
          <h4>Tambah Produk Baru</h4>
          <div class="form-group">
            <label>Nama Produk</label>
            <input type="text" id="prod_name" required>
          </div>
          <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="prod_price" required>
          </div>
          <div class="form-group">
            <label>Deskripsi Produk</label>
            <textarea id="prod_desc" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Foto Produk</label>
            <input type="file" id="prod_file" accept="image/*" required>
          </div>
          <button type="submit">Tambah Produk</button>
        </form>

        <h4>Daftar Produk</h4>
        <table>
          <thead>
            <tr>
              <th>Gambar</th>
              <th>Nama Produk</th>
              <th>Harga</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="product-list-body">
            <tr><td colspan="4" style="text-align: center;">Memuat produk...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- SECTION C: KELOLA JASA / LAYANAN -->
      <div class="card">
        <h3>3. Kelola Jasa / Layanan</h3>
        <form id="service-form" style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
          <h4>Tambah Jasa Baru</h4>
          <div class="form-group">
            <label>Nama Jasa / Layanan</label>
            <input type="text" id="serv_title" required>
          </div>
          <div class="form-group">
            <label>Deskripsi Layanan</label>
            <textarea id="serv_desc" rows="3"></textarea>
          </div>
          <button type="submit">Tambah Jasa</button>
        </form>

        <h4>Daftar Jasa</h4>
        <table>
          <thead>
            <tr>
              <th>Nama Jasa</th>
              <th>Deskripsi</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="service-list-body">
            <tr><td colspan="3" style="text-align: center;">Memuat jasa...</td></tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <!-- ========================================== -->
  <!-- 3. LOGIKA JAVASCRIPT & SUPABASE INTEGRATION -->
  <!-- ========================================== -->
  <script>
    // --- KONFIGURASI SUPABASE ---
    // (Ganti string di bawah ini dengan URL dan ANON KEY milik Anda dari Dashboard Supabase)
    const SUPABASE_URL = 'https://krxzhxxytjmqmvzndofw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BtMu9ACi_o-V29IdGZdIDA_th6tjNzi';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'website-assets';

    // Elements DOM
    const loginSection = document.getElementById('login-section');
    const adminDashboard = document.getElementById('admin-dashboard');

    // --- 1. OTENTIKASI & CEK LOGIN ---
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        loginSection.style.display = 'none';
        adminDashboard.style.display = 'block';
        document.getElementById('user-email').textContent = `Login sebagai: ${session.user.email}`;
        
        // Load data admin saat berhasil login
        loadSettings();
        loadProducts();
        loadServices();
      } else {
        loginSection.style.display = 'block';
        adminDashboard.style.display = 'none';
      }
    }

    checkAuth();

    // Login Event
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        document.getElementById('auth-error').textContent = error.message;
      } else {
        document.getElementById('auth-error').textContent = '';
        checkAuth();
      }
    });

    // Logout Event
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      checkAuth();
    });

    // --- HELPER: UPLOAD FILE KE STORAGE ---
    async function uploadFileToStorage(file) {
      if (!file) return null;
      const ext = file.name.split('.').pop();
      const fileName = `${Date.now()}.${ext}`;
      
      const { data, error } = await supabase.storage.from(BUCKET_NAME).upload(fileName, file);
      if (error) {
        alert('Gagal mengunggah gambar: ' + error.message);
        return null;
      }
      
      const { data: publicUrlData } = supabase.storage.from(BUCKET_NAME).getPublicUrl(fileName);
      return publicUrlData.publicUrl;
    }

    // --- 2. LOGIKA PENGATURAN UMUM ---
    async function loadSettings() {
      const { data } = await supabase.from('site_settings').select('*');
      if (data) {
        data.forEach(item => {
          if (item.key === 'site_title') document.getElementById('site_title').value = item.value;
          if (item.key === 'whatsapp_number') document.getElementById('whatsapp_number').value = item.value;
          if (item.key === 'logo_url' && item.value) {
            document.getElementById('current-logo-container').innerHTML = `<p>Logo Saat Ini:</p><img src="${item.value}" class="preview">`;
          }
        });
      }
    }

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('site_title').value;
      const wa = document.getElementById('whatsapp_number').value;
      const logoFile = document.getElementById('logo_file').files[0];

      // Update teks settings
      await supabase.from('site_settings').upsert({ key: 'site_title', value: title });
      await supabase.from('site_settings').upsert({ key: 'whatsapp_number', value: wa });

      // If upload new logo
      if (logoFile) {
        const logoUrl = await uploadFileToStorage(logoFile);
        if (logoUrl) {
          await supabase.from('site_settings').upsert({ key: 'logo_url', value: logoUrl });
        }
      }

      alert('Pengaturan berhasil disimpan!');
      loadSettings();
    });

    // --- 3. LOGIKA KELOLA PRODUK ---
    async function loadProducts() {
      const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('product-list-body');
      tbody.innerHTML = '';

      if (data && data.length > 0) {
        data.forEach(prod => {
          tbody.innerHTML += `
            <tr>
              <td><img src="${prod.image_url || 'https://via.placeholder.com/80'}" class="preview"></td>
              <td><strong>${prod.name}</strong><br><small>${prod.description || ''}</small></td>
              <td>Rp ${Number(prod.price).toLocaleString('id-ID')}</td>
              <td>
                <button class="btn-danger" onclick="deleteProduct('${prod.id}')">Hapus</button>
              </td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada produk.</td></tr>';
      }
    }

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('prod_name').value;
      const price = document.getElementById('prod_price').value;
      const description = document.getElementById('prod_desc').value;
      const file = document.getElementById('prod_file').files[0];

      const imageUrl = await uploadFileToStorage(file);
      if (!imageUrl) return;

      const { error } = await supabase.from('products').insert([{ name, price, description, image_url: imageUrl }]);
      
      if (error) {
        alert('Gagal menambah produk: ' + error.message);
      } else {
        alert('Produk berhasil ditambahkan!');
        document.getElementById('product-form').reset();
        loadProducts();
      }
    });

    async function deleteProduct(id) {
      if (confirm('Yakin ingin menghapus produk ini?')) {
        await supabase.from('products').delete().eq('id', id);
        loadProducts();
      }
    }

    // --- 4. LOGIKA KELOLA JASA ---
    async function loadServices() {
      const { data } = await supabase.from('services').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('service-list-body');
      tbody.innerHTML = '';

      if (data && data.length > 0) {
        data.forEach(serv => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${serv.title}</strong></td>
              <td>${serv.description || '-'}</td>
              <td>
                <button class="btn-danger" onclick="deleteService('${serv.id}')">Hapus</button>
              </td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada jasa.</td></tr>';
      }
    }

    document.getElementById('service-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('serv_title').value;
      const description = document.getElementById('serv_desc').value;

      const { error } = await supabase.from('services').insert([{ title, description }]);
      
      if (error) {
        alert('Gagal menambah jasa: ' + error.message);
      } else {
        alert('Jasa berhasil ditambahkan!');
        document.getElementById('service-form').reset();
        loadServices();
      }
    });

    async function deleteService(id) {
      if (confirm('Yakin ingin menghapus jasa ini?')) {
        await supabase.from('services').delete().eq('id', id);
        loadServices();
      }
    }
  </script>
</body>
</html>
